[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/gui", "crates/android"]
# O crate Android só faz sentido compilado com cargo ndk.
default-members = ["crates/core", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jhordanleandro/AtlasDisco"
homepage = "https://jhordanleandro.github.io/AtlasDisco"
rust-version = "1.80"

[workspace.dependencies]
atlasdisco-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rayon = "1.10"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# A varredura fica lenta em debug; otimiza as dependências mesmo no perfil de desenvolvimento.
[profile.dev.package."*"]
opt-level = 2
