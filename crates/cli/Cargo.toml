[package]
name = "atlasdisco-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "AtlasDisco command line: scan, export, search, duplicates, compare and schedule"

[[bin]]
name = "atlasdisco-cli"
path = "src/main.rs"

[dependencies]
atlasdisco-core.workspace = true
chrono.workspace = true
clap = { version = "4.5", features = ["derive"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls", "hostname"] }

[dev-dependencies]
tempfile = "3"
